# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.description }}, and so on.

title: Jan Domanski
email: ~
description: >- # this means to ignore newlines until "baseurl:"
  "a biochemist with programming skills" CTO and co-founder of a science tech startup @Labstep 🧫 Helps co-organize @HackAndTellLdn a 1000+ tech meetup in London
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jandomanski.com" # the base hostname & protocol for your site

# Build settings
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# minima master (v3), pinned to a SHA so theme pushes can't change the live site
remote_theme: jekyll/minima@4de3223

minima:
  skin: auto
  # explicit nav so the titled homepage doesn't appear in the header
  nav_pages:
    - software.markdown
    - blog.markdown
    - publications.markdown
    - about.markdown
  social_links:
    - { title: GitHub, icon: github, url: "https://github.com/jandom" }
    - { title: Twitter, icon: x-twitter, url: "https://twitter.com/jandom_random" }

# Google Analytics
google_analytics: G-N1NW3RGG60

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

exclude:
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - infra/
  - node_modules/
  - vendor/
  - venv/
  - _posts/2020/2020-07-30-deploy-create-react-app-aws-pulumi/my-app
